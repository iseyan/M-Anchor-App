name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-package-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    name: Verify ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run offline checks
        run: python scripts/ci.py --output _ci
      - name: Save verification records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: _ci/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build verified source ZIP
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and verify ZIP
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/build_release.py --output dist --source-commit "$SOURCE_COMMIT"
      - name: Save package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m-anchor-app-package-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
